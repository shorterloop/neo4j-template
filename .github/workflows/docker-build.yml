name: Build Neo4j image
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image without optional CSV imports
        run: docker build --pull --progress=plain -t neo4j-template:ci .
